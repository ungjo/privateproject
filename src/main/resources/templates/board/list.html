<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>privateproject - 목록</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/board-list.css}">
</head>
<body>

<!-- ===== 네비게이션 바 ===== -->
<!-- 비로그인 상태 -->
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div th:replace="~{fragments/layout :: div-logo"></div>

<!-- 로그인 상태 (위 nav-bar 대신 사용)
<nav class="nav-bar">
    <a class="nav-title" href="01_list.html">📋 세미 프로젝트 게시판</a>
    <div class="nav-links">
        <span class="nav-name">홍길동</span>님 환영합니다
        <a href="#">로그아웃</a>
    </div>
</nav>
-->

<div class="container">

    <!-- ===== 글쓰기 버튼 (로그인 상태에서만 표시) ===== -->
    <div class="write-btn-area">
        <a th:href="@{/board/write.html}" class="btn btn-primary">게시글 쓰기</a>
    </div>

        <!-- ===== 검색 폼 ===== -->
        <form class="search-form" th:action="@{/board/list}" method="get">
            <input type="text" name="keyword" placeholder="제목 또는 작성자 검색" th:value="${keyword}">
            <button type="submit" class="btn btn-secondary">검색</button>
            <!-- 검색 중일 때만 전체보기 버튼 표시 -->
            <!-- <a href="01_list.html" class="btn">전체보기</a> -->

            <!-- (Top3)Best 댓글로 이동하는 버튼 -->
            <div class="toTop3">
                <a th:href="@{/board/bestCommentList}">Best 댓글</a>
            </div>
        </form>


    <!-- 검색 결과 안내 (검색 중일 때만 표시) -->
    <!-- <p class="search-keyword">'Spring' 검색 결과</p> -->


    <!-- ===== 게시글 목록 테이블 ===== -->
    <table class="board-table">
        <thead>
            <tr>
                <th style="width:70px">번호</th>
                <th>제목</th>
                <th style="width:70px">댓글</th>
                <th style="width:100px">작성자</th>
                <th style="width:120px">날짜</th>
                <th style="width:70px">조회수</th>
            </tr>
        </thead>
        <tbody>
            <!--게시글 없을 때-->
        </tbody>
    </table>

    <!-- ===== 페이징 ===== -->
    <!--<div class="pagination">
         <a href="#">◀ 이전</a> 
        <a href="#" class="active">1</a>
        <a href="#">2</a>
        <a href="#">3</a>
         <a href="#">다음 ▶</a> 
    </div>-->

</div>
</body>
</html>
